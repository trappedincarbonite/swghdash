<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWGHDash | Farm Guide</title>
    <link rel="icon" type="image/x-icon" href="../img/favicon.ico">
    <link rel="stylesheet" href="../style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .image-viewport {
            width: 100%;
            height: 100%;
            background: #070a13;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: zoom-in; /* Default state: click to zoom in */
        }
        .farm-guide-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
            transition: opacity 0.2s ease;
        }

        /* Zoomed-in State: Full width with scrolling */
        .image-viewport.is-zoomed {
            display: block; /* Break flex to allow scrolling */
            overflow-y: auto;
            overflow-x: hidden;
            cursor: zoom-out;
        }
        .image-viewport.is-zoomed .farm-guide-img {
            width: 100%;
            max-width: none;
            max-height: none;
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-300">
    <div id="app" class="flex flex-col h-screen overflow-hidden">
        
        <header class="bg-[#0f172a] border-b border-slate-800 main-header shrink-0">
            <div class="flex items-center gap-10 shrink-0">
                <div class="logo-container">
                    <a href="../index.html" class="header-logo-link">SWGHDASH</a>
                    <span class="logo-pipe">|</span>
                    <span class="logo-subtitle subtitle-fleet uppercase font-black tracking-widest">Farm Guide</span>
                </div>
            </div>
            <div class="ml-auto flex items-center gap-8">
                <nav id="menu-links" class="nav-link-text shrink-0"></nav>
		<input type="text" id="search-input" placeholder="Search..." class="search-input-global">
            </div>
        </header>

        <!-- div class="bg-[#0f172a]/30 border-b border-slate-800 shrink-0 flex items-center justify-between px-6 py-2 sub-header">
            <div class="flex items-center gap-6 stats-text">
                <span class="font-black text-yellow-500 uppercase">AhnaldT101 Farm Guide 2025</span>
                <span class="mx-2 text-slate-800">|</span>
                <span class="text-[10px] text-slate-500 uppercase italic">View: Fit to Screen - Click to zoom full width</span>
            </div>
        </div -->

        <main class="flex-1 overflow-hidden relative">
            <div id="image-container" class="image-viewport" onclick="toggleZoom()">
                <img 
                    src="../img/ahnald_farm_guide_2025.jpg" 
                    alt="Ahnald Farm Guide 2025" 
                    class="farm-guide-img"
                    id="guide-img"
                >
            </div>
        </main>

        <footer class="bg-[#0f172a] border-t border-slate-800 px-6 py-2 shrink-0 flex justify-between items-center">
            <div id="jvfunc_gamestats_js"></div>
            <div class="text-[9px] text-slate-400 font-mono uppercase tracking-[0.2em]">BUILD_260313_1028</div>
        </footer>
    </div>

    <script src="../js/nav.js"></script>
    <script src="../js/gamestats.js"></script>
    <script>
        function toggleZoom() {
            const container = document.getElementById('image-container');
            container.classList.toggle('is-zoomed');
            
            // Scroll to top when zooming in for a better start
            if (container.classList.contains('is-zoomed')) {
                container.scrollTop = 0;
            }
        }

        async function initPage() {
            try {
                const response = await fetch('../data/swgoh_data.json');
                const data = await response.json();
                if (typeof window.renderAccountStats === 'function') {
                    window.renderAccountStats(data.header, 'jvfunc_gamestats_js');
                }
            } catch (err) {
                console.error("Initialization failed:", err);
            }
        }
        window.onload = initPage;
    </script>
</body>
</html>
